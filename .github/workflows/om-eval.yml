# One-off: fetch Open-Meteo recent-analysis and lead-time series at the reference stations' NASA cells (tools/om_eval).
name: Open-Meteo evaluation (fetch)
on:
  push:
    paths: ['tools/om_eval/fetch.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-sync
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u tools/om_eval/fetch.py
      - name: Commit
        if: always()
        run: |
          git config user.name  "nasa-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/om_eval/out
          git diff --cached --quiet && exit 0
          git commit -m "data: Open-Meteo evaluation series"
          git pull --rebase && git push
