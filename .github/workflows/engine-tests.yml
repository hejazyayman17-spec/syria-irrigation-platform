# Runs the shared engine test vectors on every push (the same vectors will gate the future C# engine).
name: Engine tests
on:
  push:
    paths: ['js/engine/**', 'tests/**', 'tools/fao56.py', '.github/workflows/engine-tests.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tests/run_engine_tests.js
      - run: python3 tools/fao56.py
